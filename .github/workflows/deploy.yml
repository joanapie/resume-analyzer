name: Deploy to GKE

on:
  push:
    branches: [main]

env:
  PROJECT_ID: resume-analyzer-496023
  GKE_CLUSTER: resume-analyzer-cluster
  GKE_ZONE: us-central1-a
  IMAGE: us-central1-docker.pkg.dev/resume-analyzer-496023/resume-analyzer/app
  WORKLOAD_IDENTITY_PROVIDER: projects/710922001447/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  SERVICE_ACCOUNT: github-actions@resume-analyzer-496023.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          docker build -t $IMAGE:$GITHUB_SHA -t $IMAGE:latest .
          docker push $IMAGE:$GITHUB_SHA
          docker push $IMAGE:latest

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials $GKE_CLUSTER \
            --zone $GKE_ZONE \
            --project $PROJECT_ID

      - name: Deploy to GKE
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/postgres.yaml
          kubectl apply -f k8s/redis.yaml
          kubectl apply -f k8s/app.yaml
          kubectl set image deployment/resume-analyzer \
            app=$IMAGE:$GITHUB_SHA \
            -n resume-analyzer
          kubectl rollout status deployment/resume-analyzer -n resume-analyzer